name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="$PWD"
            echo "Android project found in repository root."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project and no ZIP file found."
              exit 1
            fi

            echo "Found source ZIP: $ZIP_FILE"

            rm -rf project
            mkdir -p project

            unzip -q -o "$ZIP_FILE" -d project

            PROJECT_DIR="$PWD/project"

            # Handle ZIP containing one outer folder.
            if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] &&
               [ ! -f "$PROJECT_DIR/settings.gradle" ]; then

              INNER="$(find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"

              if [ -n "$INNER" ] &&
                 [ -f "$INNER/settings.gradle.kts" -o -f "$INNER/settings.gradle" ]; then
                PROJECT_DIR="$INNER"
              fi
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          # GitHub Actions CI
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configuration-cache=false
          org.gradle.caching=true
          org.gradle.workers.max=4
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          android.enableJetifier=true
          googleServices.missing.passthrough=true
          EOF

          echo "Gradle configuration:"
          cat gradle.properties

      - name: Create Gradle Wrapper if missing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing. Creating it..."
            gradle wrapper --gradle-version 9.3.1
          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew projects \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MVP-ESPORTS-LIVE-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
