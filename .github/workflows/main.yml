name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          echo "Found: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          INNER=$(find project -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ] && [ $(find project -maxdepth 1 -mindepth 1 -type d | wc -l) -eq 1 ]; then
            mv "$INNER"/* project/ 2>/dev/null || true
            mv "$INNER"/.[!.]* project/ 2>/dev/null || true
            rmdir "$INNER" 2>/dev/null || true
          fi

      - name: Create dummy google-services.json
        run: |
          APP_DIR=$(find project -type d -path "*/app" | head -1)
          if [ ! -f "$APP_DIR/google-services.json" ]; then
            cat > "$APP_DIR/google-services.json" << 'EOF'
          {
            "project_info": { "project_number": "123456789012", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:abc", "android_client_info": { "package_name": "com.example.esports" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummy" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradle.properties & KSP Crash
        run: |
          GRADLE_DIR=$(dirname $(find project -name "gradlew" | head -1))
          
          # Clean old gradle.properties and write exact CI compatible properties
          cat > "$GRADLE_DIR/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=false
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configuration-cache=false
          ksp.useKSP2=false
          ksp.incremental=false
          ksp.run.in.separate.process=false
          EOF

      - name: Install Xvfb (Virtual Display for KSP)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Build Debug APK
        run: |
          GRADLEW=$(find project -name "gradlew" | head -1)
          chmod +x "$GRADLEW"
          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR"
          
          # Run inside virtual display to fix java.awt headless NullPointerException
          xvfb-run -a ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            project/**/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
