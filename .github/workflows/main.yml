name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          echo "Found: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          INNER=$(find project -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ] && [ $(find project -maxdepth 1 -mindepth 1 -type d | wc -l) -eq 1 ]; then
            mv "$INNER"/* project/ 2>/dev/null || true
            mv "$INNER"/.[!.]* project/ 2>/dev/null || true
            rmdir "$INNER" 2>/dev/null || true
          fi

      - name: Create dummy google-services.json
        run: |
          APP_DIR=$(find project -type d -path "*/app" | head -1)
          if [ ! -f "$APP_DIR/google-services.json" ]; then
            cat > "$APP_DIR/google-services.json" << 'EOF'
          {
            "project_info": { "project_number": "123456789012", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:abc", "android_client_info": { "package_name": "com.example.esports" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummy" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      # 🟢 1. Gradle Wrapper ko stable 8.7 par downgrade karein (Gradle 9 incompatibilities fix karne ke liye)
      - name: Force Stable Gradle 8.7
        run: |
          WRAPPER_PROP=$(find project -name "gradle-wrapper.properties" | head -1)
          if [ -f "$WRAPPER_PROP" ]; then
            echo "Updating $WRAPPER_PROP to Gradle 8.7"
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' "$WRAPPER_PROP"
            cat "$WRAPPER_PROP"
          fi

      # 🟢 2. Fix KSP Versions across all files
      - name: Fix KSP version
        run: |
          find project -type f \( -name "*.toml" -o -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/2\.3\.5/2.3.6/g' {} +

      - name: Fix gradle.properties
        run: |
          GRADLE_DIR=$(dirname $(find project -name "gradlew" | head -1))
          cat >> "$GRADLE_DIR/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configuration-cache=false
          ksp.incremental=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          GRADLEW=$(find project -name "gradlew" | head -1)
          chmod +x "$GRADLEW"
          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
