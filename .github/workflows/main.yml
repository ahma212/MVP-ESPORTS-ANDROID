name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          echo "Found: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          INNER=$(find project -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ] && [ $(find project -maxdepth 1 -mindepth 1 -type d | wc -l) -eq 1 ]; then
            mv "$INNER"/* project/ 2>/dev/null || true
            mv "$INNER"/.[!.]* project/ 2>/dev/null || true
            rmdir "$INNER" 2>/dev/null || true
          fi

      # 🟢 Fix 1: Auto-Patch Kotlin Compilation Errors (setTargetFps & isActive)
      - name: Fix Kotlin Source Compilation Errors
        run: |
          echo "Patching LiveAnalyzerViewModel.kt..."
          find project -name "LiveAnalyzerViewModel.kt" -exec sed -i 's/frameSampler\.setTargetFps/frameSampler.setTargetSampleFps/g' {} +
          
          echo "Patching BroadcastVideoMemeOverlayLayer.kt..."
          find project -name "BroadcastVideoMemeOverlayLayer.kt" -exec sed -i 's/while (isActive)/while (playbackJob?.isActive == true)/g' {} +
          
          echo "Verified Source Code Patched."

      # 🟢 Fix 2: Google Services Setup (com.example.esports)
      - name: Force Fix google-services.json
        run: |
          find project -name "google-services.json" -delete || true
          APP_DIRS=$(find project -type d -name "app")
          for DIR in $APP_DIRS; do
            cat > "$DIR/google-services.json" << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "esports-app",
              "storage_bucket": "esports-app.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {
                  "package_name": "com.example.esports"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKey1234567890123456789" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          done

      # 🟢 Fix 3: Upgrade KSP 2.3.5 to 2.3.6
      - name: Fix KSP 2.3.5 Bug
        run: |
          find project -type f \( -name "*.toml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) -exec sed -i 's/2\.3\.5/2.3.6/g' {} +

      - name: Fix gradle.properties
        run: |
          GRADLE_DIR=$(dirname $(find project -name "gradlew" | head -1))
          cat >> "$GRADLE_DIR/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configuration-cache=false
          ksp.incremental=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          GRADLEW=$(find project -name "gradlew" | head -1)
          chmod +x "$GRADLEW"
          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
