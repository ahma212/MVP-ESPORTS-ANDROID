name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1) Find Android project
      # ------------------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="$PWD"
            echo "Android project found in repository root."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or source ZIP found."
              exit 1
            fi

            echo "Found source ZIP: $ZIP_FILE"

            rm -rf project
            mkdir -p project
            unzip -q -o "$ZIP_FILE" -d project

            PROJECT_DIR="$PWD/project"

            if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
               [ ! -f "$PROJECT_DIR/settings.gradle" ]; then

              INNER="$(find "$PROJECT_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"

              if [ -n "$INNER" ] && \
                 { [ -f "$INNER/settings.gradle.kts" ] || [ -f "$INNER/settings.gradle" ]; }; then
                PROJECT_DIR="$INNER"
              fi
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

      # ------------------------------------------------------------
      # 2) JDK 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # 3) Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 4) Gradle 9.3.1
      # ------------------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ------------------------------------------------------------
      # 5) Fix project Gradle settings
      # ------------------------------------------------------------
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          # GitHub Actions CI
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configuration-cache=false
          org.gradle.caching=true
          org.gradle.workers.max=4
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          EOF

          echo "========================================"
          echo "GRADLE PROPERTIES"
          echo "========================================"
          cat gradle.properties

      # ------------------------------------------------------------
      # 6) Controlled KSP fix
      # ------------------------------------------------------------
      - name: Pin KSP to 2.3.7
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          TOML="gradle/libs.versions.toml"

          if [ ! -f "$TOML" ]; then
            echo "ERROR: $TOML not found."
            exit 1
          fi

          echo "Before KSP change:"
          grep -n "googleDevtoolsKsp" "$TOML" || true

          sed -i \
            's/googleDevtoolsKsp[[:space:]]*=[[:space:]]*"2\.3\.5"/googleDevtoolsKsp = "2.3.7"/' \
            "$TOML"

          echo "After KSP change:"
          grep -n "googleDevtoolsKsp" "$TOML" || true

          if ! grep -q 'googleDevtoolsKsp = "2.3.7"' "$TOML"; then
            echo "ERROR: KSP version was not changed to 2.3.7."
            exit 1
          fi

      # ------------------------------------------------------------
      # 7) Do NOT create fake google-services.json
      # ------------------------------------------------------------
      - name: Check Google Services configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/google-services.json" ]; then
            echo "Real google-services.json found."
          else
            echo "No google-services.json found."
            echo "Continuing because the project is configured to WARN when it is missing."
          fi

      # ------------------------------------------------------------
      # 8) Create Gradle wrapper if missing
      # ------------------------------------------------------------
      - name: Create Gradle Wrapper if missing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper is missing."
            echo "Creating wrapper with Gradle 9.3.1..."

            gradle wrapper --gradle-version 9.3.1

          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x ./gradlew

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version

      # ------------------------------------------------------------
      # 9) Clean previous build
      # ------------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # ------------------------------------------------------------
      # 10) Verify Gradle project
      # ------------------------------------------------------------
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew projects \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # ------------------------------------------------------------
      # 11) Build Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info

      # ------------------------------------------------------------
      # 12) Find APK
      # ------------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 13) Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MVP-ESPORTS-LIVE-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
