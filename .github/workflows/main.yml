name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          echo "=== Root files ==="
          ls -la

      - name: Unzip source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Koi zip file nahi mili!"
            ls -la
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          echo "=== After unzip ==="
          ls -la project/

          # Agar zip ke andar ek folder hai to uske content upar lao
          INNER_COUNT=$(find project -maxdepth 1 -mindepth 1 -type d | wc -l)
          if [ "$INNER_COUNT" -eq 1 ]; then
            INNER=$(find project -maxdepth 1 -mindepth 1 -type d | head -1)
            echo "Inner folder: $INNER"
            mv "$INNER"/* project/ 2>/dev/null || true
            mv "$INNER"/.[!.]* project/ 2>/dev/null || true
            rmdir "$INNER" 2>/dev/null || true
          fi

          echo "=== Final structure ==="
          ls -la project/
          find project -name "gradlew" | head -3

      - name: Create dummy google-services.json (if missing)
        run: |
          APP_DIR=$(find project -type d -path "*/app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "app folder nahi mila"
            find project -maxdepth 3 -type d
            exit 1
          fi
          echo "App dir: $APP_DIR"
          if [ ! -f "$APP_DIR/google-services.json" ]; then
            echo "Creating dummy google-services.json..."
            cat > "$APP_DIR/google-services.json" << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-esports-project",
              "storage_bucket": "dummy-esports-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.example.esports"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "google-services.json already exists"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd project
          GRADLEW=$(find . -name "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew nahi mila!"
            find . -maxdepth 4 -type f | head -40
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW"
          chmod +x "$GRADLEW"
          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR"
          echo "Building from: $(pwd)"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
