      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          # --------------------------------------------------------
          # Case 1: Android project already exists in repository root
          # --------------------------------------------------------
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then

            PROJECT_DIR="$PWD"

            echo "Android project found in repository root:"
            echo "$PROJECT_DIR"

          else

            # ------------------------------------------------------
            # Case 2: Android project is inside a ZIP
            # ------------------------------------------------------
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project and no ZIP file found."
              exit 1
            fi

            echo "Source ZIP found:"
            echo "$ZIP_FILE"

            rm -rf project
            mkdir -p project

            unzip -q -o "$ZIP_FILE" -d project

            echo ""
            echo "ZIP contents:"
            find project -maxdepth 5 -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print

            # ------------------------------------------------------
            # Recursively find the real Gradle project
            # ------------------------------------------------------
            SETTINGS_FILE="$(
              find project -type f \
                \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then
              echo ""
              echo "ERROR: settings.gradle.kts or settings.gradle was NOT found anywhere inside ZIP."
              echo ""
              echo "Top-level extracted folders:"
              find project -maxdepth 3 -type d -print
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo ""
            echo "Gradle settings found:"
            echo "$SETTINGS_FILE"

            echo ""
            echo "ANDROID PROJECT DIRECTORY:"
            echo "$PROJECT_DIR"
          fi

          # --------------------------------------------------------
          # Export project path
          # --------------------------------------------------------
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts or app/build.gradle not found."
            echo ""
            echo "Files near project root:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo ""
          echo "Android project detected successfully."

          echo ""
          echo "Project root files:"
          ls -la "$PROJECT_DIR"
